events {
    worker_connections 1024;
}

http {
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    server {
        listen 80;
        server_name kami-k.ru 30215.snk.wtf;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/letsencrypt;
            default_type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name kami-k.ru;
        ssl_certificate /etc/letsencrypt/live/kami-k.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/kami-k.ru/privkey.pem;
        keepalive_timeout 70;

        location / {
            proxy_pass http://app:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 443 ssl;
        server_name 30215.snk.wtf;
        ssl_certificate /etc/letsencrypt/live/30215.snk.wtf/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/30215.snk.wtf/privkey.pem;

        location / {
            return 404;
        }
    }
}
